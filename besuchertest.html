<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Besucherzählung testen</title><style>body{font:17px system-ui,Arial;max-width:650px;margin:40px auto;padding:20px;background:#f5f8f5;color:#16372b}main{background:white;padding:24px;border-radius:14px;box-shadow:0 3px 18px #0001}#result{padding:18px;border:2px solid #167750;border-radius:9px;font-weight:700;overflow-wrap:anywhere}a{color:#087f5b}</style></head><body><main><h1>Besucherzählung – Test</h1><p>Diese Seite prüft die Datenbank direkt, ohne die normale App oder eine Browser-Konsole.</p><p id="result" role="status">Testseite geladen. Datenbank wird geprüft …</p><p><a href="./">Zur Startseite</a></p></main><script>(async()=>{const e=document.getElementById('result');try{let id=localStorage.getItem('site_visitor_uuid');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){id=crypto.randomUUID();localStorage.setItem('site_visitor_uuid',id)}const r=await fetch('https://pspiijpyvzqtcyathezw.supabase.co/rest/v1/rpc/track_visitor',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_wQTUSxhBV2oBBCiZ0ldg5w_qbbd45KX'},body:JSON.stringify({p_visitor_id:id})});if(!r.ok){e.textContent='FEHLER '+r.status+': '+(await r.text()).slice(0,350)}else{e.textContent='OK – Testaufruf wurde von der Datenbank bestätigt.'}}catch(err){e.textContent='FEHLER – '+String(err.message||err)}})();</script></body></html>
