<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script>
"use strict";
const db=window.supabase?.createClient("https://pspiijpyvzqtcyathezw.supabase.co","sb_publishable_wQTUSxhBV2oBBCiZ0ldg5w_qbbd45KX");
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");let lang=localStorage.getItem("m237_lang")==="en"?"en":"fr",listing=null;
const names={electronics:["Électronique","Electronics"],vehicles:["Véhicules","Vehicles"],property:["Immobilier","Property"],fashion:["Mode","Fashion"],home:["Maison","Home"],jobs:["Emploi","Jobs"],services:["Services","Services"],other:["Autres","Other"]};
const t=(fr,en)=>lang==="fr"?fr:en;
function translate(){$("lang").textContent=lang==="fr"?"EN":"FR";$("back").textContent=t("← Toutes les annonces","← All listings");$("descriptionHeading").textContent="Description";$("contact").textContent=t("Contacter sur WhatsApp","Contact on WhatsApp");$("safety").textContent=t("Conseil de sécurité : vérifiez le produit et évitez les paiements anticipés.","Safety tip: inspect the item and avoid advance payments.");if(listing)renderInfo()}
function renderInfo(){const p=listing;$("title").textContent=p.title;document.title=p.title+" | Mokolo237";$("price").textContent=new Intl.NumberFormat(lang==="fr"?"fr-FR":"en-US").format(p.price_fcfa)+" FCFA";$("city").textContent=p.city;$("meta").textContent=p.city+" · "+(names[p.category]?.[lang==="fr"?0:1]||p.category)+" · "+new Date(p.created_at).toLocaleDateString(lang==="fr"?"fr-FR":"en-GB");$("description").textContent=p.description;const number=String(p.contact_whatsapp||"").replace(/\D/g,"");if(/^2376\d{8}$/.test(number)){$("contact").href="https://wa.me/"+number+"?text="+encodeURIComponent(t("Bonjour, votre annonce Mokolo237 m'intéresse : ","Hello, I'm interested in your Mokolo237 listing: ")+location.href);$("contact").hidden=false;$("contact").onclick=()=>{db.rpc("track_contact",{p_listing_id:p.id}).then(()=>{}).catch(()=>{})}}else $("contact").hidden=true}
function showPictures(urls){const gallery=$("gallery"),thumbs=$("thumbs");gallery.replaceChildren();thumbs.replaceChildren();if(!urls.length){gallery.textContent=t("Aucune photo disponible","No photos available");gallery.style.padding="80px 15px";gallery.style.textAlign="center";return}const main=document.createElement("img");main.className="mainpic";main.alt=listing.title;gallery.append(main);const buttons=[];urls.forEach((url,i)=>{const btn=document.createElement("button"),img=document.createElement("img");img.src=url;img.alt="Photo "+(i+1);img.loading="lazy";btn.append(img);btn.onclick=()=>{main.src=url;buttons.forEach(b=>b.classList.remove("active"));btn.classList.add("active")};thumbs.append(btn);buttons.push(btn)});buttons[0].click()}

</script><div id="report-area" style="margin:18px auto;max-width:900px;padding:14px;border:1px solid #ddd;border-radius:10px"><button id="report-open" type="button" style="padding:9px 12px;cursor:pointer">⚑ Signaler cette annonce / Report listing</button><form id="report-form" hidden style="margin-top:12px"><label for="report-reason">Motif / Reason</label> <select id="report-reason" required><option value="fraud">Arnaque / Fraud</option><option value="duplicate">Doublon / Duplicate</option><option value="inappropriate">Contenu inapproprié / Inappropriate</option><option value="other">Autre / Other</option></select><p><textarea id="report-details" maxlength="500" rows="3" placeholder="Détails facultatifs / Optional details" style="width:100%;box-sizing:border-box"></textarea></p><button type="submit">Envoyer le signalement / Send report</button><p id="report-status" role="status"></p></form></div><script>
document.getElementById('report-area').hidden=true;

const reportObserver=new MutationObserver(()=>{const d=document.getElementById('detail');if(d&&!d.hidden){document.getElementById('report-area').hidden=false;reportObserver.disconnect()}});reportObserver.observe(document.body,{attributes:true,subtree:true,attributeFilter:['hidden']});
